# nginx/seaman.conf — Seaman Reborn 本番リバースプロキシ設定
#
# デプロイ先:
#   /etc/nginx/sites-available/seaman
#   → ln -s ../sites-available/seaman /etc/nginx/sites-enabled/seaman
#
# プレースホルダ（scripts/setup-instance.sh が deploy 時に sed で置換）:
#   seaman.local   公開ドメイン名（例: seaman.example.com）
#   /Users/monge/workspace/seaman-reborn  静的ファイルのルート（例: /opt/seaman-modern）
#
# ローカル疎通テストの要点（詳細は docs/deployment.md）:
#   1. /etc/hosts に「127.0.0.1 seaman.local」を追加
#   2. mkcert 等で seaman.local 用の証明書を生成
#   3. seaman.local を seaman.local、/Users/monge/workspace/seaman-reborn をリポジトリ絶対パスに sed 置換
#   4. ssl_certificate と ssl_certificate_key のパスを生成した証明書に差し替え
#   5. auth_basic_user_file もローカル用の htpasswd に差し替え
#   6. Ollama / VOICEVOX をホスト OS で起動（11434 / 50021）
#
# 設計メモ — COOP/COEP の add_header 重複について:
#   nginx の add_header は同一 location 内に 1 つでも add_header があると
#   親（http/server）の add_header をすべて継承しない仕様。
#   そのため SharedArrayBuffer 用の COOP/COEP/CORP 三点セットを
#   各 location ブロックで明示的に再宣言している（共通スニペット化は
#   sites-available への配布が二重になるため避けた）。

# ─────────────────────────────────────────────
# HTTP (80): ACME チャレンジ許可 + HTTPS リダイレクト
# ─────────────────────────────────────────────
server {
    listen 8080;
    listen [::]:8080;
    server_name seaman.local;

    # certbot --webroot 用。443 を 80 にプロキシしない。
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

# ─────────────────────────────────────────────
# HTTPS (443): メインサーバ
# ─────────────────────────────────────────────
server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name seaman.local;

    # TLS（Let's Encrypt）
    ssl_certificate     /Users/monge/workspace/seaman-reborn/nginx/.local/seaman.local.pem;
    ssl_certificate_key /Users/monge/workspace/seaman-reborn/nginx/.local/seaman.local-key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Basic 認証（サーバレベル指定 → 全 location に継承される）
    auth_basic           "Demo Access";
    auth_basic_user_file /Users/monge/workspace/seaman-reborn/nginx/.local/seaman.htpasswd;

    root  /Users/monge/workspace/seaman-reborn;
    index index.html;

    # gzip 圧縮（WASM / JS / JSON が主な対象。WAV/MP3 は既圧縮なので外す）
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm
        image/svg+xml;
    gzip_static on;  # 事前 .gz があれば優先配信

    # 大きいレスポンスのバッファ調整（embedder/glb 等の同時取得用）
    sendfile         on;
    tcp_nopush       on;
    tcp_nodelay      on;

    # ─── 静的バイナリ: 長期キャッシュ + immutable ──────────────
    location ~* \.(wasm|bin|onnx|glb|gltf|woff2)$ {
        expires 1y;
        add_header Cache-Control                "public, immutable" always;
        add_header Cross-Origin-Opener-Policy   "same-origin"       always;
        add_header Cross-Origin-Embedder-Policy "credentialless"    always;
        add_header Cross-Origin-Resource-Policy "cross-origin"      always;
        try_files  $uri =404;
    }

    # ─── Ollama API: NDJSON ストリーミング ─────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:11434/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # NDJSON / SSE: バッファリング無効化
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # 会話履歴を含むため少し余裕を持たせる
        client_max_body_size 10m;

        add_header Cross-Origin-Opener-Policy   "same-origin"    always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "cross-origin"   always;
    }

    # ─── VOICEVOX Engine: prefix 削除して転送 ──────────────
    # 末尾の "/" が重要: /voicevox/audio_query → /audio_query にリライトされる
    location /voicevox/ {
        proxy_pass         http://127.0.0.1:50021/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 1m;

        add_header Cross-Origin-Opener-Policy   "same-origin"    always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "cross-origin"   always;
    }

    # ─── 静的配信（HTML / JS / その他） ─────────────────────
    # HTML/JS は no-cache でデプロイ時の即時反映を優先
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control                "no-cache"       always;
        add_header Cross-Origin-Opener-Policy   "same-origin"    always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "cross-origin"   always;
    }
}
}
