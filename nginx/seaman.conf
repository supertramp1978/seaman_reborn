# nginx/seaman.conf — 本番デプロイ用テンプレート
# scripts/deploy.sh または setup-instance.sh が sed で以下を置換する:
#   __WEBROOT__  → /opt/seaman-modern
#   __DOMAIN__   → seaman.example.com

server {
    listen 80;
    server_name __DOMAIN__;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    root  __WEBROOT__;
    index index.html;

    # Basic 認証
    auth_basic           "Demo Access";
    auth_basic_user_file /etc/nginx/seaman.htpasswd;

    # COOP/COEP/CORP: SharedArrayBuffer (Whisper.cpp マルチスレッド) のため
    add_header Cross-Origin-Opener-Policy   "same-origin"    always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "cross-origin"   always;

    # 大容量バイナリアセットは長期キャッシュ
    location ~* \.(wasm|bin|onnx|glb)$ {
        expires    1y;
        add_header Cache-Control                "public, immutable";
        add_header Cross-Origin-Opener-Policy   "same-origin"    always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "cross-origin"   always;
    }

    # HTML / JS はキャッシュしない（リロード後に即反映）
    location ~* \.(html|js)$ {
        add_header Cache-Control                "no-cache";
        add_header Cross-Origin-Opener-Policy   "same-origin"    always;
        add_header Cross-Origin-Embedder-Policy "credentialless" always;
        add_header Cross-Origin-Resource-Policy "cross-origin"   always;
    }

    # Ollama リバースプロキシ（NDJSON ストリーミング対応）
    location /api/ {
        proxy_pass         http://127.0.0.1:11434/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_buffering    off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # VOICEVOX リバースプロキシ（/voicevox プレフィックスを除去）
    location /voicevox/ {
        rewrite            ^/voicevox/(.*)$ /$1 break;
        proxy_pass         http://127.0.0.1:50021;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        client_max_body_size 1m;
    }

    # 静的ファイル配信（SPA フォールバック）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
